version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-conversation-studio
    ports:
      - "8000:8000"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      DB_PATH: ${DB_PATH:-/data/studio.db}
    restart: unless-stopped
